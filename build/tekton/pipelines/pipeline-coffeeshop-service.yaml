apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-and-push-coffeeshop-service
  labels:
    app: coffeeshop-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  params:
    - default: latest
      description: Image Tag Value
      name: IMAGE_TAG
      type: string
  tasks:
    - name: git-clone
      params:
        - name: URL
          value: https://github.com/aws-redhat-gameday/coffeeshop-app.git
        - name: SUBDIRECTORY
          value: ""
        - name: DELETE_EXISTING
          value: "true"
        - name: USER_HOME
          value: "/tmp"
        - name: SSL_VERIFY
          value: "false"
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: build-app
      params:
        - name: CONTEXT_DIR
          value: coffeeshop-service
        - name: GOALS
          value:
            - "-DskipTests"
            - clean
            - package
      runAfter:
        - git-clone
      taskRef:
        kind: Task
        name: maven
      workspaces:
        - name: maven-settings
          workspace: maven-settings
        - name: source
          workspace: shared-workspace
    - name: build-image
      params:
        - name: CONTEXT
          value: coffeeshop-service
        - name: DOCKERFILE
          value: coffeeshop-service/Dockerfile
        - name: IMAGE
          value: >-
            image-registry.openshift-image-registry.svc:5000/coffeeshop-build/coffeeshop-service:$(params.IMAGE_TAG)
        - name: TLSVERIFY
          value: "false"
        - name: BUILD_EXTRA_ARGS
          value: "--security-opt unmask=/proc/interrupts"
      runAfter:
        - build-app
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: shared-workspace
  workspaces:
    - name: shared-workspace
    - name: maven-settings
